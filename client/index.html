<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
         anything but 0 on notched iPhones — EkBrandLine relies on it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/fixed_price_logo_bitmap.png" />
    <link rel="apple-touch-icon" href="/fixed_price_logo_bitmap.png" />
    <meta property="og:image" content="/fixed_price_logo_bitmap.png" />
    <title>এক দাম — Fixed Price</title>
    <!-- KUI's stylesheet pulls its own faces (Inter / Poppins / Hind Siliguri).
         Unbounded and Nunito used to be requested here and were never referenced
         by any rule — two render-blocking font requests for nothing. Keep the
         preconnects so KUI's @import resolves faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
